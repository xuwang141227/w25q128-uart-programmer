name: UART Flash regression
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install HDL tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq iverilog yosys
      - name: Run Python and pin-level HDL regressions
        run: make -j3 test
      - name: Upload synthesis log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthesis-log
          path: build/synthesis.log
